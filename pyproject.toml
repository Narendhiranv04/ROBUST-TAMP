[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-tamp"
version = "0.1.0"
description = "Deciding If, When, and Where to Replan for Robust Manipulation"
requires-python = ">=3.12"

[project.scripts]
robust-tamp = "robust_tamp.__main__:main"

[tool.setuptools]
include-package-data = false
packages = ["experiments", "baselines", "diagnostics", "evaluation", "grill_task2", "llm_pipeline", "mujoco_port", "pddlstream", "pddlstream.algorithms", "pddlstream.algorithms.scheduling", "pddlstream.language", "pddlstream.retired", "robust_tamp", "vlm_pipeline", "vlm_pipeline.constraints"]
py-modules = ["generalize_PP_box_gui", "rlbench_kitchen_streams", "ground_truth_orchestrator", "rlbench_kitchen_env", "rlbench_kitchen_env_constrained", "sim_backend", "script_3_open_grasp_open_box_gui", "live_segmentation_viewer", "video_recorder", "segmentation_object_detector", "rlbench_kitchen_streams_constrained", "pipeline", "tkinter_segmentation_viewer", "generalize_pick_place_gui"]

[tool.setuptools.package-dir]
"experiments" = "experiments"
"" = "src"
"baselines" = "src/baselines"
"diagnostics" = "src/diagnostics"
"evaluation" = "experiments/evaluation"
"grill_task2" = "src/grill_task2"
"llm_pipeline" = "src/llm_pipeline"
"mujoco_port" = "src/mujoco_port"
"pddlstream" = "src/pddlstream/pddlstream"
"pddlstream.algorithms" = "src/pddlstream/pddlstream/algorithms"
"pddlstream.algorithms.scheduling" = "src/pddlstream/pddlstream/algorithms/scheduling"
"pddlstream.language" = "src/pddlstream/pddlstream/language"
"pddlstream.retired" = "src/pddlstream/pddlstream/retired"
"robust_tamp" = "src/robust_tamp"
"vlm_pipeline" = "src/vlm_pipeline"
"vlm_pipeline.constraints" = "src/vlm_pipeline/constraints"
